logo:
  svg: "harness/style-guide/assets/cpme-logo.svg"       # vector master (built by src/build_logo.py)
  pdf: "harness/style-guide/assets/cpme-logo.pdf"       # same vector, for print
  png: "harness/style-guide/assets/cpme-logo-2400.png"  # 2400 px wide, transparent
  original_bitmap: "harness/style-guide/assets/cpme-logo-original.png"  # 288 x 216 px, reference only
  dxf: "harness/cad-lib/cpme-logo.dxf"                  # block CPME_LOGO_EMBEDDED, one colour
  aspect: 1.361                                         # width / height of the vector artwork
  clear_space: 0.25                                 # fraction of logo height, every side
  min_width_in: 0.5
  min_width_px: 48
  background: "white or very light; on dark, a white rounded tile"

colors:
  navy: "#0D1554"           # CPME Navy, logo (measured)
  steel: "#7E849E"          # CPME Steel, logo (measured); large text and rules only
  document_blue: "#0B5394"  # section bars, header rule (2025 proposal)
  ink: "#0F1733"
  ink_2: "#3A4466"
  muted: "#6B7394"
  rule: "#CFD5E6"
  tint: "#EEF2FB"
  page: "#F4F6FB"
  white: "#FFFFFF"
  status:
    ok: "#138A5A"
    warning: "#B7791F"
    fail: "#C53030"

fonts:
  documents: {heading: "Arial", body: "Arial", numbers: "Arial"}
  web: {heading: "Archivo", body: "IBM Plex Sans", numbers: "IBM Plex Mono",
        fallback: "system-ui, 'Segoe UI', Arial, sans-serif",
        google_fonts: "https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"}
  slides: {heading: "Arial", body: "Arial"}
  email: {body: "Arial"}

