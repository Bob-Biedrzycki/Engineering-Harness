# Tag and line numbering rules, company-wide (harness). Engineer-owned (project engineer). Bob approves.
# Designation: harness, Bob, chat, 2026-10-30: "ISA-5.1 style with loop numbers, like PI-101 and TCV-201 for the
# whole company and every project moving forward including this one. naming the lines is also important."
# Applies to every P&ID, list and model from 2026-10-30: every new P&ID, every project P&ID (the project open that day
# included), and the job typical P&IDs and models at their next revision. Revisions filed before 2026-10-30 keep
# the tags they were filed with (TR-08).
# Hard rule 1 still governs: a tag is assigned by these rules on the P&ID that carries it, never made up in a list
# or a model. The lists and the model take their tags from the P&ID; the P&ID is the one source (hard rule 8).
meta:
  owner: "<project engineer>"
  revision: 1
  basis: >-
    ISA-5.1-2022 Instrumentation and Control Symbols and Identification (identification letters, loop numbers,
    suffixes; harness/knowledge/Design Standards.md); CPME practice for equipment, line items and lines, which
    ISA-5.1 does not cover. Designation: harness, Bob, chat, 2026-10-30.

# ---------------------------------------------------------------------------------------------
# Loop numbers
# ---------------------------------------------------------------------------------------------
loop_numbers:
  id: TAG-LOOP-001
  rule: >-
    A loop number is three digits, <series><nn>. The first digit is the system the loop measures or acts on
    (series below); <nn> runs 01, 02 ... within the series in P&ID reading order, left to right then top to bottom,
    by the loop's primary element (the sensor, or the valve where there is no sensor). Every device of one loop
    (element, transmitter, controller, switch, final element) carries the same number: TT-201, TIC-201, TCV-201.
    A number once used on a project is never reused for a different loop on that project.
  digits: 3
  series:
    "1": steam supply (the steam inlet to the exchanger or injector, both sides of a pressure reducing station)
    "2": hot water (the heated water - supply, return, recirculation, product or plant water being heated)
    "3": condensate (exchanger outlet to the condensate tie-in, drip legs, traps, pump-traps)
    "4": cold and make-up water (fill, make-up, backflow preventer, cold water feed)
    "5": utilities (instrument air, drains, vents and relief discharges that are lines of their own)
    "9": spare
  overflow: >-
    ASSUMPTION: a project needing more than 99 loops in one series, or more than one skid on one P&ID, takes four
    digits, <unit><series><nn> (e.g. TCV-1201 on unit 1); none does yet (Q-number raised when one does).
  basis: "ISA-5.1-2022 loop identification; series CPME practice. Designation: harness, Bob, chat, 2026-10-30"

# ---------------------------------------------------------------------------------------------
# Instruments and instrument valves
# ---------------------------------------------------------------------------------------------
instrument_tags:
  id: TAG-ISA-001
  rule: >-
    Every instrument and every instrument valve is tagged <ISA letters>-<loop number>, e.g. PI-101, TI-201,
    TT-201, TIC-201, TCV-201, TSH-202, XV-202, PSV-103, PCV-102, FSL-203, LT-205. Letters per ISA-5.1 (first
    letter the measured variable, then readout and output functions). A loop with two devices of the same letters
    adds a suffix letter, A, B ... (PI-101A, PI-101B). Exactly as drawn on the P&ID, upper case, one hyphen.
  instrument_valves:
    TCV: temperature control valve
    PCV: self-acting pressure reducing valve (regulator); drawn earlier as PRV
    PSV: safety / relief valve
    XV: on-off valve (shutoff, fail closed)
    LCV: level control valve
    FCV: flow control valve
  local_gauges: >-
    A local gauge (PI, TI) with no loop of its own takes the next loop number in its series; it is not folded into
    a nearby control loop.
  basis: "ISA-5.1-2022 sections 4 and 5. Designation: harness, Bob, chat, 2026-10-30"

# ---------------------------------------------------------------------------------------------
# Equipment and line items (ISA-5.1 does not cover these)
# ---------------------------------------------------------------------------------------------
equipment_tags:
  id: TAG-EQ-001
  rule: >-
    Equipment is tagged <code>-<series><nn>, numbered within the series of the system it serves, in P&ID reading
    order. Identical units in parallel (duty / standby) share one number with suffix A, B: P-201A, P-201B.
    An equipment code never equals an ISA-5.1 instrument tag's letters (PT, TT, FT, LT and the like), so a tag
    reads one way only.
  codes:
    HX: heat exchanger
    P: pump, including a pump-trap (P-301); never PT, which ISA-5.1 reserves for a pressure transmitter
    ET: expansion tank
    TK: tank
    AS: air and dirt separator
    S: steam moisture separator
    DSH: direct steam heater / injector
    CP: control panel
  basis: "CPME practice. Designation: harness, Bob, chat, 2026-10-30"

line_item_tags:
  id: TAG-ITEM-001
  rule: >-
    Manual valves and in-line specialty items are tagged <code>-<series><nn>, numbered within the series of the
    line they sit on, in P&ID reading order, one sequence per code. They do not take loop numbers.
  codes:
    HV: manual valve (isolation, drain, vent, bypass); drawn earlier as ISO
    CHK: check valve
    STR: strainer
    TRAP: steam trap
    AAV: automatic air vent
    AV: thermostatic steam air vent
    VB: vacuum breaker
    RPZ: reduced pressure zone backflow preventer
    SG: sight glass
  basis: "CPME practice. Designation: harness, Bob, chat, 2026-10-30"

# ---------------------------------------------------------------------------------------------
# Lines
# ---------------------------------------------------------------------------------------------
line_numbers:
  id: LINE-NUM-001
  rule: >-
    Every line is numbered <service code>-<series><nn>, e.g. SS-101, LPS-102, HWS-201, HWR-202, CR-301, MUW-401.
    The series is the system's (TAG-LOOP-001); <nn> runs 01, 02 ... within the series in P&ID reading order,
    following the flow from the inlet tie-in. A line runs from one piece of equipment, tie-in or branch tee to the
    next and has one size and one spec along its whole length: a reducer, a branch to a different destination, a
    spec break (service class, material, pressure class) or a piece of equipment starts the next number. In-line
    valves, strainers, traps and instruments do not break a line. The line number carries no size and no spec
    (DRF-LBL-004); size, schedule, material and spec are in the line list. Spools are <line>-SPnn and welds
    <spool>-Wnn (CLAUDE.md "Units and naming"), so spool SS-101-SP02 is on line SS-101.
  service_codes:
    SS: steam supply
    LPS: low pressure steam (downstream of a pressure reducing valve)
    CR: condensate return
    PC: pumped condensate (pump-trap discharge)
    HWS: hot water supply
    HWR: hot water return
    HW: hot water, once-through (direct supply)
    PW: plant water to be heated (direct supply inlet)
    MUW: make-up water
    CW: cold water
    IA: instrument air
    D: drain
    V: vent
    RV: relief valve discharge
  tie_ins: >-
    A battery-limit connection is tagged TP-<line number> (TP-SS-101), the line it ends.
  basis: "CPME practice; ASME B31 and plant practice that a line number holds one size and one spec. Designation: harness, Bob, chat, 2026-10-30"
