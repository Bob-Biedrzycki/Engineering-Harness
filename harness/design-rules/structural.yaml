# Structural rules, company-wide (harness): pipe supports for stainless sanitary tube on any CPME skid, and the
# reference list of frame materials (STR-FRAME-001, frame-materials.csv beside this file).
# Engineer-owned; Bob approves. These are first-pass design checks, not a certification (Gate 3).
# Where a rule applies on a project and any project-only value go in that project's
# <project>/01_Design_Basis/05_Standards_Specifications/Design_Rules/structural.yaml, under the same rule id
# (<project> = the project folder, job/Project-*). A new rule is added only after Bob says which level it belongs at
# (harness, job or project; harness/design-rules/README.md).
#
# SCOPE (PIPE-SVC-001, harness/design-rules/piping.yaml): STR-PS-001 and STR-PS-002 cover stainless sanitary TUBE
# (the hygienic service class, and utility-water lines built in tube). Carbon steel steam, condensate and utility PIPE
# has no support rule yet; supports on those lines are sized per the project's governing code (SAN-PIPE-001) and
# recorded as an ASSUMPTION until Bob designates a rule.
meta:
  owner: "<project engineer>"
  revision: 10
  status: >-
    Rev 10, 2026-11-23: STR-PS-001 hanger values corrected to AWI's own prints and STEP models (HS-100T-H,
    HS-200T-H, HS-300T-H; Corbin Flower, AWI, email 2026-11-23, received through Bob, chat: "They're in the email
    for you to grab"). 1.0 in: height 1.625 (was 1.5625 from the web table), bracket flat 0.8125 from the tube
    centreline, 1/4-20 bolts (was 5/16), bracket 1.00 and collar 1.50 along the tube now from the print (the rev 9
    ASSUMPTIONS dropped). Flat widths across the tube added for 1, 2 and 3 in; 2 and 3 in dimensions to the
    prints' three places. Load rating: AWI has none per hanger; its catalog spacing table recorded against
    STR-PS-002 (STR-PS-002 is the tighter; no value changed). Weld fit of the 3/4 in bar on the 1 in and 2 in
    flats recorded as open (Q-0081). No key renamed or removed; keys added: bracket_flat_width_across_in,
    bracket_flat_length_along_in, bolts per size, bracket_part / collar_part numbers, print, load_rating,
    weld_fit.
    Rev 9, 2026-11-23: STR-PS-001 rewritten for a new hanger make, the AWI Manufacturing stainless hex hanger with
    collar (HS-200T-H, HS-200T-C, HS-300T-C), on a 3/4 in solid round 304 bar welded to the hanger's bracket, with a
    rod length limit from the sway load case (support_member max_length_in 29.6). The McMaster 8831T38 hanger, its
    stud, EPDM seat washer, weld base plate and the 1 x 1 x 0.065 in square support tube are withdrawn from the rule.
    Keys read by code are kept with their values (weld.leg_in, every sizing_load_case key, all of STR-PS-002); the
    clamp block and the old support_member values are replaced. STR-PS-002: the joint-clearance basis now cites the
    AWI 1.50 in collar; its values are unchanged. Designation harness (Bob, chat, 2026-11-23: "The support rule can
    move to the engineering harness."). Same day: hanger.by_od_in "1.0" added (HS-100T-H, from the AWI product page
    table; cut sheet not on file) and 1.0 in added to applies_to, for the 1.0 in supports on hygienic drain lines.
    Rev 8, 2026-11-06: new rule STR-FRAME-001, the reference list of frame materials (frame-materials.csv), from the
    AISC Shapes Database v16.0 until CPME has established suppliers (Bob, chat, 2026-11-06; designation harness).
    STR-PS-001 and STR-PS-002 unchanged.
    Rev 7, 2026-10-26: STR-SHEET-001/002 removed and the superseded STR-PS-001 hardware records dropped; scope
    stated as sanitary tube (Bob, chat, 2026-10-26). Values and keys of STR-PS-001 and STR-PS-002 are
    unchanged; their basis is CPME practice.

pipe_supports:
  - id: STR-PS-001
    rule: >-
      A 1.0 in, 2.0 in or 3.0 in OD tube support is one AWI stainless hex hanger with
      collar (hanger below) on one support member: a 3/4 in diameter solid
      round bar, ASTM A276 / A479 304, standing straight under the tube
      centreline from the frame member or equipment top it stands on to the
      centre of the outer flat of the hanger's lower bracket. The bar top is
      fillet welded all round to that flat and the bar bottom is fillet welded
      all round to the member or equipment top, both CONTINUOUS (no stitch
      welds; SAN-FRAME-001); a solid bar has no open end to seal. A hung
      support (the bar down from above to the outer flat of the upper
      bracket) and a side support (a horizontal bar from a member face to the
      outer flat of a hanger turned to face it) use the same parts and welds,
      turned. The collar is rated at or above the design temperature of the
      line it carries (collar_selection). The collar is out of the brackets
      while welding; heat tint is removed from the bracket and the bar and
      they are passivated (ASTM A380 / A967), and the collar goes back only on
      a cool, rinsed, dry bracket. Length: no bar is longer than
      support_member max_length_in, the length at which its sway at the
      hanger under the sizing load case reaches sway_limit_in. Where the drop
      is longer, a post or member (PS-nnn or FM-nnn, sealed per
      SAN-FRAME-001) brings the bar's base up so the bar stays within
      max_length_in, as the earlier 5/8 in rod rule did (a 12 in rod with a
      post making up the height, before Rev 4 of this rule). The bar is not
      made larger instead: a bar over 3/4 in plus its two fillet legs would
      not land on the 1.00 in wide bracket.
    applies_to: 1.0 in, 2.0 in and 3.0 in OD stainless sanitary tube
    support_member:
      material: ASTM A276 / A479 304 solid round bar
      diameter_in: 0.75
      area_in2: 0.4418              # pi d^2 / 4
      I_in4: 0.01553                # pi d^4 / 64
      S_in3: 0.04142                # pi d^3 / 32
      max_length_in: 29.6           # (sway_limit_in x 3 x E_psi x I_in4 / side_load_lb)^(1/3) = 29.66 in, rounded down
      length: member or equipment top to the hanger bracket flat, at most max_length_in; a longer drop stands the bar on a post or member (rule)
      orientation: standing (vertical, under the tube centreline); hung (vertical, from above); side (horizontal, from a member face)
      ends: fillet weld all round, continuous, both ends (top to the bracket's outer flat, bottom to the member or equipment top)
    hanger:
      vendor: AWI Manufacturing, Inc. (Winsted, MN)
      series: Stainless Steel Hex Hangers with Collar, tube size
      source: >-
        https://awimfg.com/product/stainless-steel-hex-hangers-with-collar/ (read 2026-11-23); AWI cut sheets
        HS-200T-H, HS-200T-C and HS-300T-C (revision -, version 1), received from Bob 2026-11-22; AWI prints and
        STEP models HS-100T-H (ID 691556), HS-200T-H (ID 692329) and HS-300T-H (ID 692667), version 1, and the
        AWI Process Piping Catalog, from Corbin Flower, AWI, email 2026-11-23. Where a print and the web table
        differ the print governs.
      bracket_material: 304 stainless
      bracket_thickness_in: 0.1875
      bracket_width_along_tube_in: 1.00
      bracket_halves: two, bolted together at both ears
      bolts: 2 x 5/16-18 x 1 in 304 hex head bolts with 2 x 5/16-18 304 lock nuts (red wax)   # 2 and 3 in; 1 in under by_od_in
      collar_width_along_tube_in: 1.50
      weight_capacity_lb: unknown   # AWI has no load rating per hanger (load_rating)
      load_rating: >-
        AWI states it has no individual load rating for each hanger (Corbin Flower, AWI, email 2026-11-23). Its
        catalog (AWI Process Piping Catalog, printed page 25, "Recommended Hanger Spacing") gives maximum tube
        hanger spacing of 8 ft (96 in) for 1 to 1.5 in tube and 10 ft (120 in) for 2 to 3 in tube, as estimates
        from AWI's experience, with extra hangers for valves and instruments. STR-PS-002 is tighter on every size
        (1.0 in 72 in, job value; 2.0 in 84 in; 3.0 in 96 in), set by sag against the slope rule, so there is no
        conflict and STR-PS-002 governs. The 50 lb per support load basis (sizing_basis) stays CPME's.
      weld_fit: >-
        The bar top weld lands on the bracket's outer flat. 2.0 in: the 3/4 in bar plus two 1/8 in fillet legs is
        1.00 in, against a flat 0.990 in across x 1.00 in along, so the fillet toes overhang the flat by about
        0.005 in each side across the tube. 1.0 in: the flat is 0.412 in across, narrower than the 0.75 in bar, so
        the bar does not land on the flat. 3.0 in: flat 1.567 in across, fits. Open, Bob's decision (Q-0081); not
        resolved in this rule.
      component: unknown            # add the AWI parts to the component library (skill component-add)
      by_od_in:
        "1.0":                                  # AWI print HS-100T-H version 1 (ID 691556) and STEP
          overall_width_in: 3.375               # ear to ear (print)
          overall_height_in: 1.625              # print (the web table's B 1 9/16 is superseded)
          bracket_flat_from_tube_cl_in: 0.8125  # half of 1.625
          bracket_flat_width_across_in: 0.412   # AWI STEP
          bracket_flat_length_along_in: 1.00
          bracket_width_along_tube_in: 1.00     # print
          collar_width_along_tube_in: 1.50      # print
          bracket_thickness_in: 0.1875          # print
          bracket: BK-100T-NH
          bracket_part: AW1000451               # 304 (print item 1)
          bolts: 2 x 1/4-20 x 0.75 in 304 hex head bolts with 2 x 1/4-20 304 lock nuts (red wax)   # print items 3, 4
          print: >-
            The title block reads material "Mild Steel" while item 1, the bracket, reads 304 and the description
            reads T304: a question for AWI, recorded, not resolved here. The 304 of item 1 is used.
          high_temp:
            part_number: HS-100T-H
            collar: CH-100T
            collar_part: "1003625"
            collar_material: polysulfone
            collar_temperature_f: 325           # continuous (AWI, high temp collar)
        "2.0":
          overall_width_in: 4.438               # across the bolt ears (AWI print and STEP; cut sheet 4.44, AWI page A 4 7/16)
          overall_height_in: 2.625              # AWI print (cut sheet 2.63, AWI page B 2 5/8)
          bracket_flat_from_tube_cl_in: 1.3125  # outer flat of each bracket from the tube centreline, half of 2.625
          bracket_flat_width_across_in: 0.990   # AWI STEP
          bracket_flat_length_along_in: 1.00
          bracket: BK-200T-NH
          bracket_part: AW1000453
          high_temp:
            part_number: HS-200T-H
            collar: CH-200T
            collar_material: polysulfone
            collar_temperature_f: 325           # continuous (AWI); softening 374 F
          standard:
            part_number: HS-200T-C
            collar: CP-200T
            collar_material: polypropylene
            collar_temperature_f: see collar_selection   # AWI gives deflection temperatures only
        "3.0":
          overall_width_in: 5.625               # HS-300T-C; HS-300T-H 5.563 (AWI print and STEP); AWI page A 5 9/16
          overall_height_in: 3.625              # AWI print
          bracket_flat_from_tube_cl_in: 1.8125  # half of 3.625
          bracket_flat_width_across_in: 1.567   # AWI STEP
          bracket_flat_length_along_in: 1.00
          bracket: BK-300T-NH
          bracket_part: AW1000455
          standard:
            part_number: HS-300T-C
            collar: CP-300T
            collar_material: polypropylene
            collar_temperature_f: see collar_selection
          high_temp:
            part_number: HS-300T-H              # AWI print version 1 (ID 692667) and STEP
            overall_width_in: 5.563             # AWI print (narrower ears than HS-300T-C)
            collar: CH-300T
            collar_material: polysulfone
            collar_temperature_f: 325           # continuous (AWI)
    collar_selection:
      rule: >-
        The collar is rated at or above the line's design temperature
        (line-list.csv design_temp_f). High-temp collar (CH-, polysulfone): AWI
        rates it for continuous service to 325 F. Polypropylene collar (CP-):
        AWI publishes no continuous service temperature, only typical
        deflection temperatures of 120 F at 264 psi and 225 F at 66 psi (melt
        about 329 F); it is taken as rated to 225 F where the collar bearing
        pressure (support load over tube OD x collar width) is at or below 66
        psi, else to 120 F. At the 50 lb load basis the bearing pressure is
        about 33 psi on 1.0 in tube, 17 psi on 2.0 in and 11 psi on 3.0 in. A line whose design
        temperature is unknown is not checked until it is known. Which collar
        each line takes is a project value (the project's structural.yaml).
      basis: >-
        AWI product page, "Typical Unfilled Polypropylene" and "Typical High
        Temp Collar", read 2026-11-23; the same values in the AWI Process
        Piping Catalog, printed page 23 (FAQ). Reading the polypropylene rating at the
        66 psi deflection temperature is CPME first-pass practice, ASSUMPTION
        for Bob to confirm.
    sizing_load_case:
      side_load_lb: 5.0             # sideways at the hanger
      support_fixity: fixed at the base, free at the top (cantilever)
      E_psi: 28000000.0
      sway_limit_in: 0.1            # CPME practice
      sizing_table: the model's layout note (regenerated in every model revision)
    weld:
      type: fillet, all round, both ends of the bar
      leg_in: 0.125                # limited by the 0.1875 in bracket; the 0.75 in bar plus two 1/8 in legs fills the 1.00 in bracket width
      filler: ER308L
      seal: continuous, all round, both ends of the bar (SAN-FRAME-001)
    sizing_basis: >-
      First-pass check, not a certification (Gate 3). Load per support taken as
      50 lb, as before: 2.0 x 0.065 in tube 1.37 lb/ft plus water 1.19 lb/ft =
      2.56 lb/ft over a 4 ft span (about 10 lb), one 2 in sanitary butterfly
      valve with actuator (about 10 lb), and margin. 3/4 in solid round 304: A
      0.4418 in2, I 0.01553 in4, S 0.04142 in3. Length limit, cantilever sway
      under the 5 lb side load at the hanger: L = (0.1 x 3 x 28,000,000 x
      0.01553 / 5)^(1/3) = 26,093^(1/3) = 29.66 in, held to 29.6 in (sway 0.099
      in). At 29.6 in: side-load bending moment 148 in-lb, 3.6 ksi; the 50 lb
      vertical load 0.11 ksi axial (0.34 ksi at 3 g in transport, TR-18), 3.7
      ksi with 10 % of it sideways at the hanger; Euler load (fixed base, free
      top, K 2) about 1,220 lb, 24 times the 50 lb basis and 8 times at 3 g.
      All against 18 ksi, 0.6 Fy for 304 (Fy 30 ksi), CPME practice. Weld: a
      1/8 in fillet all round the bar (throat 0.088 in) carries the 148 in-lb
      at about 3.8 ksi on the throat. The bar plus two 1/8 in legs is 1.00 in,
      the bracket's width along the tube, so the fillet toes reach the bracket
      edges with no margin. Across the tube the flat is 0.990 in (2.0 in),
      0.412 in (1.0 in) and 1.567 in (3.0 in) on AWI's STEP models; the 2.0 in
      and 1.0 in fits are open (hanger weld_fit, Q-0081).
    basis: >-
      Make: Bob, chat, 2026-11-22: "We are going to change pipe hangers. This
      is now the desired make.
      https://awimfg.com/product/stainless-steel-hex-hangers-with-collar/".
      Collar by line: Bob, chat, 2026-11-22: "L-300 and L-400 do not need the
      high temp variant." (a project value). Bar and its length: Bob, chat,
      2026-11-22: "I'm told that 'fab shop can weld the support post from 3/4
      solid rod', i suspect we still want to limit the length of the rod as we
      did in the past."; the limit is the existing sway load case (5 lb, 0.1
      in, CPME practice) applied to the bar, with a post making up a longer
      drop as the earlier rod rule did. Dimensions and materials from the AWI
      cut sheets and product page (hanger source). Weld cleaning and
      passivation ASTM A380 / A967; continuous welds SAN-FRAME-001.
      Designation: harness (Bob, chat, 2026-11-23: "The support rule can move
      to the engineering harness."). Not a 3-A or ASME BPE hygienic hanger:
      the collar sits outside the tube and touches no product, but the
      bracket-to-collar joint, the bolted ears and the lock nuts are to be
      reviewed for cleanability on each project; AWI states NSF and USDA for
      its products generally, not for this collar by name. Withdrawn at Rev 9:
      McMaster 8831T38 inverted on a 3/8-16 stud, EPDM seat washer 99186A124,
      1.25 x 1.25 x 0.1875 in weld base, 1 x 1 x 0.065 in A554 304 square
      support tube (STR-PS-001 rev 5, to Rev 8 of this file).

  - id: STR-PS-002
    rule: >-
      Supports (STR-PS-001 hangers, or an equipment nozzle or frame member that
      carries the tube) on 2.0 in OD tube are placed so that: (a) no span
      between adjacent supports along the tube centreline exceeds
      max_span_in; (b) every inline valve, check valve, strainer, instrument or
      other inline component has a support on each side within
      max_from_component_in of its clamp face (a component never counts as a
      support); (c) every change of direction has a support on at least one
      leg within max_from_elbow_in of the elbow's tangent point; (d) every
      pump suction and discharge connection has a support within
      max_from_pump_in of the pump's clamp face, so the pump casing does not
      carry the pipe weight; (e) a vertical run longer than
      vertical_guide_over_in gets one guide; (f) no hanger sits on a weld, a
      ferrule or a clamp: the hanger centre is at least min_clear_of_joint_in
      along the tube from any butt weld, ferrule face or clamp, so the collar
      bears on straight tube and every weld stays visible for inspection
      (SAN-WELD-001).
    applies_to: 2.0 in OD x 0.065 in wall stainless sanitary tube, water full
    max_span_in: 84
    max_from_component_in: 12
    max_from_elbow_in: 24
    max_from_pump_in: 24
    vertical_guide_over_in: 48
    min_clear_of_joint_in: 2.0
    sizing_basis: >-
      First-pass check, not a certification (Gate 3). Simply supported span,
      316L at 200 F (E 27,000 ksi), 2.0 x 0.065 in tube (I 0.1851 in4, S
      0.1851 in3), tube plus water 2.56 lb/ft, plus one 10.2 lb valve at mid
      span (a 2 in sanitary butterfly valve with actuator). Governing limit:
      sustained sag no more than 1/16 in, half the SAN-SLOPE-001 fall of
      1/8 in/ft over one foot, so a sagging span cannot pocket a sloped line
      (CPME practice). At 84 in: sag 0.053 in with the valve (0.028 in without);
      end slope of the sag 0.19 times the 1/8 in/ft fall; bending stress 2.2 ksi,
      6.5 ksi at 3 g vertical in transport (TR-18), against about 16.7 ksi basic
      allowable for A270 316L at 200 F (ASME B31.3 Table A-1, value unverified);
      first-mode frequency about 21 Hz; reaction at each support about 28 lb,
      inside the 50 lb load basis of STR-PS-001. At 96 in the sag with a valve
      is 0.085 in, over the limit. Dixon's 2 in sanitary hanger installation
      note (support every 10 ft, each side of every valve as close as
      possible, each change of direction) is the looser trade practice this
      rule tightens. The 12, 24 and 48 in placement values and the 2.0 in
      joint clearance are CPME practice set at first pass: 2.0 in covers the
      0.75 in half length of the 1.50 in AWI hanger collar (STR-PS-001 rev 9,
      CP-200T / CH-200T) plus the 0.500 in length of a 2 in short weld
      ferrule, leaving about 0.75 in for the clamp band and the ferrule's weld
      to the tube (0.7 in with the 1.550 in McMaster cushion before rev 9).
    verification: >-
      Measured on the 3D model along each line's centreline once hangers are
      modelled (STR-PS-001): spans, distances to component clamp faces,
      elbows and pump faces, and hanger-to-joint clearance
      (harness/checks/pipe_supports.py).
    basis: >-
      CPME practice, sized above. Designation: harness (CPME practice): the
      spans depend only on the tube, its contents and the slope rule, not on
      the project.
    values_by_od_in:                 # the 2.0 in values are the top-level keys above
      "3.0":
        applies_to: 3.0 in OD x 0.065 in wall stainless sanitary tube, water full
        max_span_in: 96
        max_from_component_in: 12
        max_from_elbow_in: 24
        max_from_pump_in: 24
        vertical_guide_over_in: 48
        min_clear_of_joint_in: 2.0   # collar side met (HS-300T-C collar CP-300T 1.50 in, as 2 in); provisional on the 3 in short weld ferrule length, not recorded here
    sizing_basis_3in: >-
      Same method as sizing_basis (simply supported span, 316L at 200 F, E
      27,000 ksi, sustained sag no more than 1/16 in, one 10.2 lb valve at mid
      span), for 3.0 x 0.065 in tube: I 0.6457 in4, S 0.4304 in3, tube plus
      water 4.88 lb/ft. Sag allows about 110 in (0.061 in with the valve at
      110 in, 0.065 in at 112 in). The span is held to 96 in by the STR-PS-001
      50 lb load basis: a support between two full 96 in spans carries about
      50 lb (25 lb from each), at 108 in about 54 lb. At 96 in: sag 0.037 in
      with the valve (0.026 in without), bending stress 1.7 ksi, 5.0 ksi at 3 g
      vertical in transport (TR-18), first mode about 22 Hz. The 12, 24 and 48
      in placement values are carried over from 2.0 in as CPME practice. The
      2.0 in joint clearance holds on the collar side: the 3 in hanger
      (HS-300T-C, STR-PS-001 rev 9) has the same 1.50 in collar as the 2 in,
      half length 0.75 in; it stays provisional on the 3 in short weld
      ferrule length, which this file does not record.
      First pass, not a certification (Gate 3). Designation: harness (CPME
      practice).

frame_materials:
  - id: STR-FRAME-001
    rule: >-
      Frame members (FM-nnn) are chosen from the reference list of common
      structural shapes in frame-materials.csv (beside this file), and their weight and section properties are
      taken from that list, not typed into a model. A shape not on the list is not used until it is added here
      with its source. The list is a reference of common materials, as an engineering student is given, until
      CPME has established suppliers; it says nothing about what a supplier stocks, its lengths or its lead time.
      When suppliers are established, their stock is recorded against this list and this rule is revised.
    table: frame-materials.csv
    columns:
      shape: HSS square, HSS rectangular, channel, angle or wide flange
      aisc_label: the designation exactly as in the AISC Manual (e.g. HSS6X3X1/4, C6X8.2, L3X3X1/4, W8X31)
      astm_grade: the AISC preferred material for that shape (grades below)
      W_lb_ft: nominal weight, lb/ft
      A_in2: cross-sectional area, in2
      depth_in: HSS Ht (longer wall); channel and W d; angle longer leg
      width_in: HSS B (shorter wall); channel and W bf; angle shorter leg
      t_nom_in: HSS nominal wall; channel and W web tw; angle leg t
      t_des_in: HSS design wall (0.93 x nominal for ERW HSS, as AISC tabulates); blank for other shapes
      Ix_in4 Sx_in3 Zx_in3 rx_in Iy_in4 Sy_in3 Zy_in3 ry_in: about the AISC x and y axes, in4, in3, in
      rz_in: angles only, least radius of gyration, in
      J_in4: torsional constant, in4
    selection: >-
      From the AISC database, shapes a skid frame commonly uses: square and rectangular HSS with the longer wall
      8 in or less, the shorter wall 1-1/2 in or more and a nominal wall 1/8 to 1/2 in (133 rectangular, 64
      square); C channels 3 to 10 in deep (26); single angles with both legs 2 to 4 in (61); W shapes 4 to 8 in
      nominal depth (23). 307 shapes. Values are copied exactly as the database gives them (US customary).
    grades:
      ASTM A500 Gr C:
        shapes: HSS square and rectangular
        Fy_ksi: 50
        Fu_ksi: 62
      ASTM A36:
        shapes: channels and angles
        Fy_ksi: 36
        Fu_ksi: 58
      ASTM A992:
        shapes: W shapes
        Fy_ksi: 50
        Fu_ksi: 65
    grades_basis: >-
      The grade per shape is the AISC Manual's preferred material for that shape; Fy and Fu are the minimums of
      each ASTM specification (A500 Gr C rectangular HSS, A36, A992). Neither the Manual table nor the ASTM
      specifications were re-read in this change: ASSUMPTION, confirm against them before a Gate 3 frame check.
    not_on_the_list: >-
      Stainless frame tube (ASTM A554), stainless round bar (ASTM A276 / A479, used for STR-PS-001 supports) and plate and flat bar (A36, A240) are not in
      the AISC database; each is added here with its own source when a frame needs it. Round HSS and pipe are
      left out of the frame list.
    source:
      title: AISC Shapes Database v16.0 (SHAPE160.xlsx), consistent with the AISC Steel Construction Manual,
        16th Edition, 1st Printing; Readme dated August 2023
      publisher: American Institute of Steel Construction
      url: https://www.aisc.org/aisc/publications/steel-construction-manual/shapes-database-v160/
      obtained: 2026-11-06, free download by Bob
      sha256: E08BEA15BBE475E78251292E5F543FF5A11D16B59C9D6AF47AEC700F8F57F050
      bytes: 2028383
      in_repo: no (AISC's file; the extracted list is frame-materials.csv)
    note: >-
      Since 2026-11-06 (Bob, chat: "Yes, wire them in") the typical models take every frame section, its grade and
      weight from this list through job/Typical-<ID prefix>/03_Working_Design/CAD/01_Master_Assembly/_lib/structure.py shape(); their sizes (HSS6X3X1/4,
