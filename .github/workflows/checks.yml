name: checks

# Runs the unit tests and every script in harness/checks/ on each pull request and
# on pushes to main and to the day's branch, and writes one row per check to the run summary. ("CI job"
# below is the GitHub Actions job, not a CPME job.)
#
# Design findings never fail the PR (Bob, chat, 2026-10-07: "The PR should not be
# flagging design findings."). The CI job goes red only when the tooling is broken,
# the unit tests fail, or a repo-integrity check fails. The policy and the list of
# hard-fail checks (HARD_FAIL_CHECKS) live in harness/scripts/run_checks.sh, which
# runs the same way locally; the exit-code contract is in harness/checks/README.md:
#   0 = PASS
#   1 + "<name>: FAIL ..." summary = FINDINGS -> ::warning; CI job passes
#        (a HARD_FAIL_CHECKS check)    = FAIL -> ::error; CI job fails
#   2 = NOT IMPLEMENTED                       -> ::warning; CI job passes
#   1 without that summary, any other code,
#   or a Python traceback  = ERROR (broken)   -> ::error; CI job fails
# Once the GitHub ruleset on main is active, make this CI job a required status check.

on:
  pull_request:
  push:
    # daily/**: the checks run on every save during the day, not stacked up for the PR (Bob, chat, 2026-11-03,
    # global "Git and backup")
    branches: [main, 'daily/**']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r harness/requirements.txt

      - name: Unit tests of the checks (harness/tests)
        run: python -m unittest discover -s harness/tests -v

      # Every job-owned tool that carries a tests/ folder (for example job/knowledge/thermal-models/tests) runs its
      # tests here, from the tool's own folder, and fails the CI job like the harness tests (Bob, chat,
      # 2026-11-06: "Add To CI"). Generic: a job with no such folder runs nothing.
      - name: Unit tests of job tools (every tests/ folder under job/)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e
          # the Engineering Harness master holds no job/ folder: nothing to run there
          [ -d job ] || { echo "no job/ folder: no job tool tests"; exit 0; }
          found=0
          while IFS= read -r d; do
            found=1
            echo "::group::$d"
            (cd "$(dirname "$d")" && python -m unittest discover -s tests -v)
            echo "::endgroup::"
          done < <(find job -type d -name tests -not -path '*/_work/*' -not -path '*/__pycache__/*' | sort)
          [ "$found" = 1 ] || echo "no job tool tests"

      - name: Run checks
        if: ${{ !cancelled() }}
        shell: bash
        run: bash harness/scripts/run_checks.sh
